<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Metrage | Мои расчеты</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .history-scroll-container {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
            margin-top: 20px;
        }
        .history-scroll-container::-webkit-scrollbar { width: 8px; }
        .history-scroll-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .history-scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .history-scroll-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Стили карточек */
        .history-item {
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fff;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .history-item:hover { background-color: #f8fafc; }
        
        /* Кастомный чекбокс */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin-top: 2px;
            transition: all 0.2s;
        }
        .custom-checkbox:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        .custom-checkbox:checked::after {
            content: '✔';
            position: absolute;
            color: white;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .history-content { flex-grow: 1; }
        .history-header { display: flex; justify-content: space-between; align-items: center; }
        
        .history-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #cbd5e1;
            font-size: 0.95rem;
            cursor: default;
        }
        .history-item.active .history-details { display: block; }
        .history-item.active { border-color: var(--primary); background-color: #f8fafc; }
        .history-desc { margin-bottom: 10px; font-style: italic; color: #475569; }

        /* Кнопки */
        .btn-edit {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 10px;
        }
        .btn-save-edit {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        /* Панель массовых действий */
        .bulk-actions {
            display: none;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            flex-direction: column;
            gap: 10px;
        }
        .bulk-actions.active { display: flex; }
        
        .bulk-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .export-settings {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9rem;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .export-settings label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

        .btn-export-selected {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-export-selected:hover { background: var(--primary-hover); }

        .btn-delete-selected {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete-selected:hover { background: #dc2626; }
        
        /* Чекбокс "Выбрать все" */
        .select-all-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .edit-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
        }

        /* Печать */
        @media print {
            body { background: white; padding: 0; }
            header, .back-btn, .no-print, #btn-logout, #btn-history, .logo, .bulk-actions, .custom-checkbox, .select-all-container { display: none !important; }
            .container { max-width: 100%; margin: 0; }
            .calc-panel { box-shadow: none; border: none; padding: 0; }
            .history-scroll-container { max-height: none; overflow: visible; padding: 0; }
            
            /* Скрываем элементы, которые не выбраны для печати */
            .history-item.print-hidden { display: none !important; }
            
            /* Настройки скрытия пользовательских данных */
            .hide-custom-title .history-type { /* Оставляем только дефолтный тип */ }
            .hide-custom-desc .history-desc { display: none !important; }

            .history-item { page-break-inside: avoid; border: 1px solid #ccc; margin-bottom: 20px; display: block; }
            .print-header { display: block !important; text-align: center; margin-bottom: 30px; }
            .print-header h1 { font-size: 24px; color: #000; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>
<div class="container">
    <header class="no-print">
        <a href="index.html" class="logo">Metrage</a>
        <div class="auth-status">
            <span id="user-name" class="hidden"></span>
            <a href="login.html" id="btn-login" class="btn-auth">Войти</a>
            <button id="btn-logout" class="btn-auth btn-outline hidden" onclick="logout()">Выйти</button>
            <a href="history.html" id="btn-history" class="btn-auth btn-outline hidden">Мои расчеты</a>
        </div>
    </header>

    <div class="calc-panel">
        <div class="print-header">
            <h1>Сводная ведомость расчетов — Metrage</h1>
            <p>Сформировано: <span id="print-date"></span></p>
        </div>

        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="back-btn">← На главную</a>
            <!-- Кнопка экспорта всего (если ничего не выбрано) -->
            <button id="btn-export-all" class="btn-auth" onclick="exportAllToPDF()" style="display: none;">📥 Экспорт всех в PDF</button>
        </div>
        
        <h2 class="no-print" style="margin-top: 15px;">Мои сохраненные расчеты</h2>

        <!-- Панель массовых действий -->
        <div class="bulk-actions no-print" id="bulk-actions-panel">
            <div class="bulk-controls">
                <span>Выбрано расчетов: <strong id="selected-count">0</strong></span>
                <button class="btn-delete-selected" onclick="deleteSelected()">🗑 Удалить выбранные</button>
            </div>
            <div class="bulk-controls" style="border-top: 1px solid #bfdbfe; padding-top: 10px;">
                <div class="export-settings">
                    <span>В PDF включать:</span>
                    <label><input type="checkbox" id="opt-custom-title" checked> Названия</label>
                    <label><input type="checkbox" id="opt-custom-desc" checked> Описания</label>
                </div>
                <button class="btn-export-selected" onclick="exportSelectedToPDF()">📥 Экспорт выбранных</button>
            </div>
        </div>

        <!-- Чекбокс выбрать все -->
        <div class="select-all-container no-print" id="select-all-container" style="display: none;" onclick="toggleSelectAll()">
            <input type="checkbox" id="select-all-checkbox" class="custom-checkbox" onclick="event.stopPropagation(); toggleSelectAll();">
            <span>Выбрать все</span>
        </div>
        
        <div class="history-scroll-container" id="history-container">
            <div id="history-list">Загрузка...</div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    // --- ЛОГИКА ВЫДЕЛЕНИЯ И ПАНЕЛИ ---
    function updateBulkActions() {
        const checkboxes = document.querySelectorAll('.history-checkbox:checked');
        const count = checkboxes.length;
        const panel = document.getElementById('bulk-actions-panel');
        const countSpan = document.getElementById('selected-count');
        const selectAllBox = document.getElementById('select-all-checkbox');
        const allBoxes = document.querySelectorAll('.history-checkbox');

        countSpan.textContent = count;

        if (count > 0) {
            panel.classList.add('active');
        } else {
            panel.classList.remove('active');
        }

        if (count === allBoxes.length && allBoxes.length > 0) {
            selectAllBox.checked = true;
        } else {
            selectAllBox.checked = false;
        }
    }

    function toggleSelectAll() {
        const selectAllBox = document.getElementById('select-all-checkbox');
        const allBoxes = document.querySelectorAll('.history-checkbox');
        allBoxes.forEach(box => box.checked = selectAllBox.checked);
        updateBulkActions();
    }

    // --- ЭКСПОРТ В PDF ---

    // Экспорт ВСЕХ расчетов (если ничего не выделено)
    function exportAllToPDF() {
        document.querySelectorAll('.history-item').forEach(item => {
            item.classList.remove('print-hidden', 'hide-custom-title', 'hide-custom-desc');
        });
        window.print();
    }

    // Экспорт ТОЛЬКО ВЫБРАННЫХ с учетом настроек
    function exportSelectedToPDF() {
        const checkboxes = document.querySelectorAll('.history-checkbox:checked');
        if (checkboxes.length === 0) return alert('Выберите хотя бы один расчет!');

        const includeTitle = document.getElementById('opt-custom-title').checked;
        const includeDesc = document.getElementById('opt-custom-desc').checked;

        const selectedIds = Array.from(checkboxes).map(box => box.value);
        
        // Проходимся по всем карточкам
        document.querySelectorAll('.history-item').forEach(item => {
            const checkbox = item.querySelector('.history-checkbox');
            const itemId = checkbox.value;

            if (selectedIds.includes(itemId)) {
                // Если выбран — показываем
                item.classList.remove('print-hidden');
                
                // Управляем названием и описанием
                if (!includeTitle) item.classList.add('hide-custom-title');
                else item.classList.remove('hide-custom-title');

                if (!includeDesc) item.classList.add('hide-custom-desc');
                else item.classList.remove('hide-custom-desc');

            } else {
                // Если не выбран — скрываем
                item.classList.add('print-hidden');
            }
        });

        // Запускаем печать
        window.print();

        // Возвращаем всё обратно после закрытия окна печати
        setTimeout(() => {
            document.querySelectorAll('.history-item').forEach(item => {
                item.classList.remove('print-hidden', 'hide-custom-title', 'hide-custom-desc');
            });
        }, 1000);
    }

    // --- УДАЛЕНИЕ ---
    async function deleteSelected() {
        const checkboxes = document.querySelectorAll('.history-checkbox:checked');
        const ids = Array.from(checkboxes).map(box => parseInt(box.value));

        if (ids.length === 0) return;
        if (!confirm(`Вы уверены, что хотите удалить ${ids.length} расчет(ов)?`)) return;

        try {
            const data = await fetchAPI('/history/delete', {
                method: 'POST',
                body: JSON.stringify({ ids })
            });

            if (data.success) {
                loadHistory();
            } else {
                alert('Ошибка при удалении');
            }
        } catch (e) {
            alert('Ошибка сети');
        }
    }

    // --- РЕДАКТИРОВАНИЕ ---
    function enableEdit(id, currentTitle, currentDesc) {
        const item = document.getElementById(`item-${id}`);
        const detailsDiv = item.querySelector('.history-details');
        detailsDiv.onclick = (e) => e.stopPropagation();

        detailsDiv.innerHTML = `
            <div style="margin-bottom: 10px;">
                <label style="font-size: 0.85rem; font-weight: bold;">Название:</label>
                <input type="text" id="edit-title-${id}" class="edit-input" value="${currentTitle || ''}" placeholder="Введите название...">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="font-size: 0.85rem; font-weight: bold;">Описание:</label>
                <textarea id="edit-desc-${id}" class="edit-input" rows="3" placeholder="Введите описание...">${currentDesc || ''}</textarea>
            </div>
            <button class="btn-save-edit" onclick="saveEdit(event, ${id})">Сохранить изменения</button>
        `;
    }

    async function saveEdit(event, id) {
        event.stopPropagation();
        const newTitle = document.getElementById(`edit-title-${id}`).value;
        const newDesc = document.getElementById(`edit-desc-${id}`).value;

        const data = await fetchAPI(`/history/${id}`, {
            method: 'PUT',
            body: JSON.stringify({ custom_title: newTitle, description: newDesc })
        });

        if (data.success) {
            loadHistory();
        } else {
            alert('Ошибка при сохранении изменений');
        }
    }

    // --- ЗАГРУЗКА СПИСКА ---
    async function loadHistory() {
        const list = document.getElementById('history-list');
        const exportAllBtn = document.getElementById('btn-export-all');
        const selectAllContainer = document.getElementById('select-all-container');
        
        if (!localStorage.getItem('token')) {
            list.innerHTML = '<p>Пожалуйста, войдите в аккаунт.</p>';
            return;
        }

        try {
            const data = await fetchAPI('/history');

            if (data.length === 0) {
                list.innerHTML = '<p>У вас пока нет сохраненных расчетов.</p>';
                exportAllBtn.style.display = 'none';
                selectAllContainer.style.display = 'none';
                updateBulkActions();
                return;
            }

            exportAllBtn.style.display = 'block';
            selectAllContainer.style.display = 'flex';

            list.innerHTML = data.map(item => {
                let detailsHtml = '';
                
                if (item.calc_type === 'paint') {
                    detailsHtml = `
                        <div class="result-title">Итог: ${item.result_data.cans} банок(и)</div>
                        <div>Площадь стен: ${item.result_data.details.sWalls} м²</div>
                        <div>Полезная площадь: ${item.result_data.details.sUseful} м²</div>
                    `;
                } else if (item.calc_type === 'tile') {
                    detailsHtml = `
                        <div class="result-title">Итог: ${item.result_data.packs} упаковок(ки)</div>
                        <div>Площадь поверхности: ${item.result_data.details.area} м²</div>
                        <div>Требуется плиток: ${item.result_data.details.totalTiles} шт.</div>
                    `;
                } else if (item.calc_type === 'wallpaper') {
                    detailsHtml = `
                        <div class="result-title">Итог: ${item.result_data.rolls} рулонов</div>
                        <div>Периметр: ${item.result_data.details.perimeter} м</div>
                        <div>Площадь стен: ${item.result_data.details.sWalls} м²</div>
                    `;
                } else if (item.calc_type === 'floor') {
                    detailsHtml = `
                        <div class="result-title">Итог: ${item.result_data.packs} упаковок(ки)</div>
                        <div>Площадь поверхности: ${item.result_data.details.area} м²</div>
                    `;
                }

                const defaultTypeName = item.calc_type === 'paint' ? '🎨 Краска' : 
                                 item.calc_type === 'tile' ? '🧱 Плитка' : 
                                 item.calc_type === 'wallpaper' ? '📜 Обои' : '🪵 Пол';
                
                // Если кастомного названия нет, используем дефолтное
                const displayTitle = item.custom_title ? `📌 ${item.custom_title}` : defaultTypeName;
                const descriptionHtml = item.description ? `<div class="history-desc">"${item.description}"</div>` : '';

                const safeTitle = (item.custom_title || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const safeDesc = (item.description || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");

                return `
                    <div class="history-item" id="item-${item.id}" onclick="this.classList.toggle('active')">
                        
                        <input type="checkbox" class="custom-checkbox history-checkbox no-print" value="${item.id}" onclick="event.stopPropagation(); updateBulkActions();">
                        
                        <div class="history-content">
                            <div class="history-header">
                                <!-- Обернули название в span с классом для скрытия при печати -->
                                <div class="history-type">
                                    <span class="custom-title-text">${item.custom_title ? '📌 ' + item.custom_title : ''}</span>
                                    <span class="default-type-text" style="${item.custom_title ? 'font-size: 0.8em; color: #64748b; display: block;' : ''}">${defaultTypeName}</span>
                                </div>
                                <div style="display: flex; align-items: center;">
                                    <div class="history-date">${new Date(item.created_at).toLocaleDateString()}</div>
                                    <button class="btn-edit no-print" onclick="event.stopPropagation(); enableEdit(${item.id}, '${safeTitle}', '${safeDesc}')">✏️ Изменить</button>
                                </div>
                            </div>
                            
                            <div class="history-details">
                                ${descriptionHtml}
                                <div style="font-weight: bold; margin-bottom: 5px;">Детали расчета:</div>
                                ${detailsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('print-date').textContent = new Date().toLocaleString();
            updateBulkActions();

        } catch (error) {
            list.innerHTML = 'Ошибка загрузки истории.';
        }
    }

    document.addEventListener('DOMContentLoaded', loadHistory);
</script>
</body>
</html>
