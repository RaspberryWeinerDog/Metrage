<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Metrage | Мои расчеты</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .history-scroll-container {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
            margin-top: 20px;
        }
        .history-scroll-container::-webkit-scrollbar { width: 8px; }
        .history-scroll-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .history-scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .history-scroll-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Стили для аккордеона истории */
        .history-item {
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .history-item:hover {
            background-color: #f8fafc;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #cbd5e1;
            font-size: 0.95rem;
            cursor: default; /* Чтобы текст можно было выделять */
        }
        .history-item.active .history-details {
            display: block;
        }
        .history-item.active {
            border-color: var(--primary);
            background-color: #f8fafc;
        }
        .history-desc {
            margin-bottom: 10px;
            font-style: italic;
            color: #475569;
            background: #fffbeb;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #f59e0b;
        }

        @media print {
            body { background: white; padding: 0; }
            header, .back-btn, .no-print, #btn-logout, #btn-history, .logo { display: none !important; }
            .container { max-width: 100%; margin: 0; }
            .calc-panel { box-shadow: none; border: none; padding: 0; }
            .history-scroll-container { max-height: none; overflow: visible; }
            .history-item { page-break-inside: avoid; border: 1px solid #ccc; margin-bottom: 20px; cursor: default; }
            .history-details { display: block !important; border-top: none; padding-top: 5px; } /* Раскрываем всё при печати */
            .print-header { display: block !important; text-align: center; margin-bottom: 30px; }
            .print-header h1 { font-size: 24px; color: #000; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>
<div class="container">
    <header class="no-print">
        <a href="index.html" class="logo">Metrage</a>
        <div class="auth-status">
            <span id="user-name" class="hidden"></span>
            <a href="login.html" id="btn-login" class="btn-auth">Войти</a>
            <button id="btn-logout" class="btn-auth btn-outline hidden" onclick="logout()">Выйти</button>
            <a href="history.html" id="btn-history" class="btn-auth btn-outline hidden">Мои расчеты</a>
        </div>
    </header>

    <div class="calc-panel">
        <div class="print-header">
            <h1>Сводная ведомость расчетов — Metrage</h1>
            <p>Сформировано: <span id="print-date"></span></p>
        </div>

        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="back-btn">← На главную</a>
            <button id="btn-export-pdf" class="btn-auth" onclick="exportToPDF()" style="display: none;">📥 Экспорт в PDF</button>
        </div>
        
        <h2 class="no-print" style="margin-top: 15px;">Мои сохраненные расчеты</h2>
        
        <div class="history-scroll-container" id="history-container">
            <div id="history-list">Загрузка...</div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    function exportToPDF() {
        window.print();
    }

    async function loadHistory() {
        const list = document.getElementById('history-list');
        const exportBtn = document.getElementById('btn-export-pdf');
        
        if (!localStorage.getItem('token')) {
            list.innerHTML = '<p>Пожалуйста, войдите в аккаунт.</p>';
            return;
        }

        try {
            const data = await fetchAPI('/history');
            if (data.length === 0) {
                list.innerHTML = '<p>У вас пока нет сохраненных расчетов.</p>';
                exportBtn.style.display = 'none';
                return;
            }

            exportBtn.style.display = 'block';

            list.innerHTML = data.map(item => {
                let detailsHtml = '';
                
                if (item.calc_type === 'paint') {
                    detailsHtml = `
                        <div class="result-title">Итог: ${item.result_data.cans} банок(и)</div>
                        <div>Площадь стен: ${item.result_data.details.sWalls} м²</div>
                        <div>Полезная площадь: ${item.result_data.details.sUseful} м²</div>
                    `;
                } else if (item.calc_type === 'tile') {
                    detailsHtml = `
                        <div class="result-title">Итог: ${item.result_data.packs} упаковок(ки)</div>
                        <div>Площадь поверхности: ${item.result_data.details.area} м²</div>
                        <div>Требуется плиток: ${item.result_data.details.totalTiles} шт.</div>
                    `;
                } else if (item.calc_type === 'wallpaper') {
                    detailsHtml = `
                        <div class="result-title">Итог: ${item.result_data.rolls} рулонов</div>
                        <div>Периметр: ${item.result_data.details.perimeter} м</div>
                        <div>Площадь стен: ${item.result_data.details.sWalls} м²</div>
                    `;
                } else if (item.calc_type === 'floor') {
                    detailsHtml = `
                        <div class="result-title">Итог: ${item.result_data.packs} упаковок(ки)</div>
                        <div>Площадь поверхности: ${item.result_data.details.area} м²</div>
                    `;
                }

                const defaultTypeName = item.calc_type === 'paint' ? '🎨 Краска' : 
                                 item.calc_type === 'tile' ? '🧱 Плитка' : 
                                 item.calc_type === 'wallpaper' ? '📜 Обои' : '🪵 Пол';
                
                // Если пользователь ввел кастомное название, показываем его
                const displayTitle = item.custom_title ? `📌 ${item.custom_title}` : defaultTypeName;
                
                // Блок с описанием
                const descriptionHtml = item.description ? `<div class="history-desc">"${item.description}"</div>` : '';

                return `
                    <div class="history-item" onclick="this.classList.toggle('active')">
                        <div class="history-header">
                            <div class="history-type">${displayTitle}</div>
                            <div class="history-date">${new Date(item.created_at).toLocaleDateString()}</div>
                        </div>
                        
                        <div class="history-details">
                            ${descriptionHtml}
                            <div style="font-weight: bold; margin-bottom: 5px;">Детали расчета:</div>
                            ${detailsHtml}
                            <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 10px;">Тип: ${defaultTypeName}</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('print-date').textContent = new Date().toLocaleString();

        } catch (error) {
            list.innerHTML = 'Ошибка загрузки истории.';
        }
    }

    document.addEventListener('DOMContentLoaded', loadHistory);
</script>
</body>
</html>
