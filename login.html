<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Metrage | Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 100px;">
    <header style="justify-content: center; border: none;">
        <a href="index.html" class="logo">Metrage</a>
    </header>
    
    <div class="calc-panel">
        <h2 id="modal-title" style="margin-bottom: 20px; text-align: center;">Вход в систему</h2>
        <form id="form-auth">
            <div class="input-group" style="margin-bottom: 15px;">
                <input type="text" id="auth-username" placeholder="Логин" required>
            </div>
            <div class="input-group" style="margin-bottom: 20px;">
                <input type="password" id="auth-password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn-calc" id="btn-submit-auth">Войти</button>
        </form>
        <p style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
            <a href="#" id="toggle-auth-mode" style="color: var(--primary);">Нет аккаунта? Зарегистрироваться</a>
        </p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
