<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Metrage | Калькулятор</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <header>
        <a href="index.html" class="logo">Metrage</a>
        <div class="auth-status">
            <span id="user-name" class="hidden"></span>
            <a href="login.html" id="btn-login" class="btn-auth">Войти</a>
            <button id="btn-logout" class="btn-auth btn-outline hidden" onclick="logout()">Выйти</button>
            <a href="history.html" id="btn-history" class="btn-auth btn-outline hidden">Мои расчеты</a>
        </div>
    </header>

    <div class="calc-panel">
        <a href="index.html" class="back-btn">← Назад в меню</a>
        <h2 id="page-title">Расчет краски</h2>
        
        <form id="form-paint" class="form-grid">
            <div class="input-group"><label>Длина (м)</label><input type="number" step="0.1" id="p-length" required></div>
            <div class="input-group"><label>Ширина (м)</label><input type="number" step="0.1" id="p-width" required></div>
            <div class="input-group"><label>Высота (м)</label><input type="number" step="0.1" id="p-height" required></div>
            <div class="input-group"><label>Дверь: ширина (м)</label><input type="number" step="0.1" id="p-door-w" required></div>
            <div class="input-group"><label>Дверь: высота (м)</label><input type="number" step="0.1" id="p-door-h" required></div>
            <div class="input-group"><label>Окно: ширина (м)</label><input type="number" step="0.1" id="p-win-w" required></div>
            <div class="input-group"><label>Окно: высота (м)</label><input type="number" step="0.1" id="p-win-h" required></div>
            <div class="input-group"><label>Слоев</label><input type="number" id="p-layers" required></div>
            <div class="input-group"><label>Расход (м²/л)</label><input type="number" id="p-coverage" required></div>
            <div class="input-group"><label>Объем банки (л)</label><input type="number" step="0.1" id="p-can" required></div>
            <div class="input-group"><label>Запас (%)</label><input type="number" id="p-reserve" required></div>
            <button type="submit" class="btn-calc">Рассчитать</button>
        </form>

        <div id="res-paint" class="result-box"></div>
        <button id="save-paint" class="btn-calc btn-save hidden">Сохранить в личный кабинет</button>
        
        <div id="mp-paint" class="marketplace-section">
            <div class="mp-buttons">
                <a href="#" id="link-wb-paint" target="_blank" class="btn-mp btn-wb">Wildberries</a>
                <a href="#" id="link-ozon-paint" target="_blank" class="btn-mp btn-ozon">Ozon</a>
                <a href="#" id="link-ya-paint" target="_blank" class="btn-mp btn-ya">Яндекс Маркет</a>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/calculators.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('title')) document.getElementById('page-title').textContent = urlParams.get('title');
</script>
</body>
</html>
