<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Metrage | Калькулятор</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <header>
        <a href="index.html" class="logo">Metrage</a>
        <div class="auth-status">
            <span id="user-name" class="hidden"></span>
            <a href="login.html" id="btn-login" class="btn-auth">Войти</a>
            <button id="btn-logout" class="btn-auth btn-outline hidden" onclick="logout()">Выйти</button>
            <a href="history.html" id="btn-history" class="btn-auth btn-outline hidden">Мои расчеты</a>
        </div>
    </header>

    <div class="calc-panel">
        <a href="index.html" class="back-btn">← Назад в меню</a>
        <h2 id="page-title">Расчет плитки</h2>
        
        <form id="form-tile" class="form-grid">
            <div class="input-group"><label>Длина (м)</label><input type="number" step="0.1" id="t-length" value="4"></div>
            <div class="input-group"><label>Ширина (м)</label><input type="number" step="0.1" id="t-width" value="3"></div>
            <div class="input-group"><label>Площадь 1 плитки (м²)</label><input type="number" step="0.01" id="t-tile-area" value="0.36"></div>
            <div class="input-group"><label>Кол-во в упаковке (шт)</label><input type="number" id="t-pack-count" value="4"></div>
            <div class="input-group"><label>Запас (%)</label><input type="number" id="t-reserve" value="10"></div>
            <button type="submit" class="btn-calc">Рассчитать</button>
        </form>

        <div id="res-tile" class="result-box"></div>
        <button id="save-tile" class="btn-calc btn-save hidden">Сохранить в личный кабинет</button>
        
        <div id="mp-tile" class="marketplace-section">
            <div class="mp-buttons">
                <a href="#" id="link-wb-tile" target="_blank" class="btn-mp btn-wb">Wildberries</a>
                <a href="#" id="link-ozon-tile" target="_blank" class="btn-mp btn-ozon">Ozon</a>
                <a href="#" id="link-ya-tile" target="_blank" class="btn-mp btn-ya">Яндекс Маркет</a>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/calculators.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('title')) document.getElementById('page-title').textContent = urlParams.get('title');
</script>
</body>
</html>
