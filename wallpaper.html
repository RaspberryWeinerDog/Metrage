<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Metrage | Калькулятор обоев</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <header>
        <a href="index.html" class="logo">Metrage</a>
        <div class="auth-status">
            <span id="user-name" class="hidden"></span>
            <a href="login.html" id="btn-login" class="btn-auth">Войти</a>
            <button id="btn-logout" class="btn-auth btn-outline hidden" onclick="logout()">Выйти</button>
            <a href="history.html" id="btn-history" class="btn-auth btn-outline hidden">Мои расчеты</a>
        </div>
    </header>

    <div class="calc-panel">
        <a href="index.html" class="back-btn">← Назад в меню</a>
        <h2 id="page-title">Расчет обоев</h2>
        
        <form id="form-wallpaper" class="form-grid">
            <div class="input-group"><label>Длина комнаты (м)</label><input type="number" step="0.1" id="w-length" value="4"></div>
            <div class="input-group"><label>Ширина комнаты (м)</label><input type="number" step="0.1" id="w-width" value="3"></div>
            <div class="input-group"><label>Высота стен (м)</label><input type="number" step="0.1" id="w-height" value="2.7"></div>
            <div class="input-group"><label>Ширина рулона (м)</label><input type="number" step="0.01" id="w-roll-w" value="0.53"></div>
            <div class="input-group"><label>Длина рулона (м)</label><input type="number" step="0.1" id="w-roll-l" value="10.05"></div>
            <div class="input-group"><label>Запас на стыковку (%)</label><input type="number" id="w-reserve" value="15"></div>
            <button type="submit" class="btn-calc">Рассчитать</button>
        </form>

        <div id="res-wallpaper" class="result-box"></div>
        
        <!-- БЛОК ДЛЯ СОХРАНЕНИЯ С КОММЕНТАРИЯМИ -->
        <div id="save-details-wallpaper" class="hidden" style="margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid var(--border);">
            <div class="input-group" style="margin-bottom: 10px;">
                <label>Название расчета (необязательно)</label>
                <input type="text" id="w-custom-title" placeholder="Например: Обои в гостиную">
            </div>
            <div class="input-group">
                <label>Описание (необязательно)</label>
                <textarea id="w-description" rows="2" placeholder="Например: Флизелиновые, с рисунком" style="padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; resize: vertical;"></textarea>
            </div>
        </div>

        <button id="save-wallpaper" class="btn-calc btn-save hidden">Сохранить в личный кабинет</button>
        
        <div id="mp-wallpaper" class="marketplace-section">
            <div class="mp-buttons">
                <a href="#" id="link-wb-wallpaper" target="_blank" class="btn-mp btn-wb">Wildberries</a>
                <a href="#" id="link-ozon-wallpaper" target="_blank" class="btn-mp btn-ozon">Ozon</a>
                <a href="#" id="link-ya-wallpaper" target="_blank" class="btn-mp btn-ya">Яндекс Маркет</a>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/calculators.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('title')) document.getElementById('page-title').textContent = urlParams.get('title');
</script>
</body>
</html>
